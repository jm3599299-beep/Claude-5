<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bungee;src:url(fuentes/Bungee-Regular.ttf)}
@font-face{font-family:Pacifico;src:url(fuentes/Pacifico-Regular.ttf)}
@font-face{font-family:Montserrat;src:url(fuentes/Montserrat.ttf);font-weight:100 900}
body{margin:0;background:#000}
</style></head>
<body><canvas id="c"></canvas>
<script>
// Identidad original del canal "Cinco Estrellas" (clips de juegos de mundo abierto).
// Todo se dibuja por código: atardecer synthwave, palmeras, cuadrícula de neón y 5 estrellas.
const ROSA='#FF2E88', CIAN='#22E4FF', AMARILLO='#FFD23F', MORADO='#2A0B4A';
const cv=document.getElementById('c'), g=cv.getContext('2d');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function estrella(cx,cy,r,rot=0){
  g.beginPath();
  for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}
  g.closePath();
}
function neon(color,blur,fn){g.save();g.shadowColor=color;g.shadowBlur=blur;fn();g.restore();}

function cielo(W,H,hor){
  const gr=g.createLinearGradient(0,0,0,hor);
  gr.addColorStop(0,'#0b0420');gr.addColorStop(.45,'#3a0d5c');gr.addColorStop(.75,'#b0236e');gr.addColorStop(1,'#ff6a3d');
  g.fillStyle=gr;g.fillRect(0,0,W,hor);
  const r=rng(9);g.fillStyle='#fff';
  for(let i=0;i<W*H/9000;i++){const y=r()*hor*.6;g.globalAlpha=.25+r()*.6*(1-y/(hor*.6));g.beginPath();g.arc(r()*W,y,r()*1.8+.4,0,6.283);g.fill();}
  g.globalAlpha=1;
}
function sol(cx,cy,R){
  g.save();
  neon('#ff3d7f',R*.5,()=>{
    const sg=g.createLinearGradient(0,cy-R,0,cy+R);sg.addColorStop(0,AMARILLO);sg.addColorStop(.55,'#ff7a3d');sg.addColorStop(1,ROSA);
    g.fillStyle=sg;g.beginPath();g.arc(cx,cy,R,0,6.283);g.fill();
  });
  // franjas retro
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<7;i++){const y=cy+R*(.05+i*.14),h=R*(.025+i*.012);g.fillRect(cx-R,y,2*R,h);}
  g.restore();
}
function suelo(W,H,hor){
  const gr=g.createLinearGradient(0,hor,0,H);gr.addColorStop(0,'#1a0630');gr.addColorStop(1,'#05010c');
  g.fillStyle=gr;g.fillRect(0,hor,W,H-hor);
  g.save();g.strokeStyle=CIAN;g.shadowColor=CIAN;g.shadowBlur=12;
  for(let i=1;i<16;i++){const t=i/16,y=hor+(H-hor)*t*t;g.globalAlpha=.25+.6*t;g.lineWidth=1+3*t;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  g.globalAlpha=.55;
  for(let i=-24;i<=24;i++){g.lineWidth=2;g.beginPath();g.moveTo(W/2+i*W*.012,hor);g.lineTo(W/2+i*W*.16,H);g.stroke();}
  g.restore();
  neon(ROSA,30,()=>{g.strokeStyle=ROSA;g.lineWidth=4;g.beginPath();g.moveTo(0,hor);g.lineTo(W,hor);g.stroke();});
}
function palmera(x,base,h,dir=1,s=1){
  g.save();g.fillStyle='#07020f';g.strokeStyle='#07020f';
  // tronco curvo
  const tx=x+dir*h*.18,ty=base-h;
  g.lineWidth=h*.045*s;g.lineCap='round';
  g.beginPath();g.moveTo(x,base);g.quadraticCurveTo(x+dir*h*.02,base-h*.6,tx,ty);g.stroke();
  // hojas
  const hojas=[[-2.9,1],[-2.4,.95],[-1.9,.85],[-1.2,.9],[-.6,1],[-.15,.95],[.35,.8],[3.3,.75]];
  for(const [a0,l] of hojas){
    const a=a0+(dir<0?0:0),L=h*.42*l;
    const ex=tx+Math.cos(a)*L, ey=ty+Math.sin(a)*L*.55+L*.28;
    const mx=tx+Math.cos(a)*L*.5, my=ty+Math.sin(a)*L*.5-L*.12;
    g.lineWidth=h*.012;g.beginPath();g.moveTo(tx,ty);g.quadraticCurveTo(mx,my,ex,ey);g.stroke();
    // foliolos
    for(let k=1;k<10;k++){
      const t=k/10,px=(1-t)*(1-t)*tx+2*(1-t)*t*mx+t*t*ex,py=(1-t)*(1-t)*ty+2*(1-t)*t*my+t*t*ey;
      const fl=L*.16*(1-t*.6);
      g.lineWidth=h*.008;g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a+1.9)*fl*.4,py+fl);g.moveTo(px,py);g.lineTo(px+Math.cos(a-1.9)*fl*.4,py+fl*.9);g.stroke();
    }
  }
  g.beginPath();g.arc(tx,ty,h*.035,0,6.283);g.fill();
  g.restore();
}
function ciudad(W,hor,h){
  const r=rng(4);g.fillStyle='#120326';
  let x=0;while(x<W){const w=40+r()*90,hh=h*(.25+r()*r()*1.1);g.fillRect(x,hor-hh,w,hh);
    g.fillStyle='rgba(255,210,120,.5)';for(let k=0;k<hh/26;k++)for(let j=0;j<w/22;j++)if(r()<.18)g.fillRect(x+6+j*20,hor-hh+8+k*24,6,9);
    g.fillStyle='#120326';x+=w+r()*20;}
}
function cincoEstrellas(cx,cy,r,gap,activas=5){
  for(let i=0;i<5;i++){
    const x=cx+(i-2)*gap;
    neon(AMARILLO,r*.9,()=>{estrella(x,cy,r);g.fillStyle=i<activas?AMARILLO:'rgba(255,255,255,.15)';g.fill();});
    estrella(x,cy,r);g.lineWidth=r*.12;g.strokeStyle='#1a0630';g.stroke();
  }
}
function texto(s,x,y,font,color,o={}){
  g.save();g.font=font;g.textAlign=o.align||'center';g.textBaseline='alphabetic';
  if(o.borde){g.lineJoin='round';g.lineWidth=o.borde;g.strokeStyle=o.bc||'#12021f';g.strokeText(s,x,y);}
  if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.gb||30;}
  g.fillStyle=color;g.fillText(s,x,y);const w=g.measureText(s).width;g.restore();return w;
}

window.render=async function(modo){
  for(const f of ['100px Bungee','100px Pacifico','800 40px Montserrat']) await document.fonts.load(f);
  if(modo==='avatar'){
    cv.width=cv.height=800;const W=800,H=800,hor=500;
    cielo(W,H,hor);sol(400,hor-10,230);suelo(W,H,hor);
    palmera(110,hor+40,380,1);palmera(700,hor+40,330,-1);
    // placa central
    g.save();g.fillStyle='rgba(18,2,31,.72)';g.beginPath();g.roundRect(70,300,660,260,40);g.fill();
    neon(CIAN,30,()=>{g.strokeStyle=CIAN;g.lineWidth=8;g.beginPath();g.roundRect(70,300,660,260,40);g.stroke();});g.restore();
    cincoEstrellas(400,385,52,124);
    texto('CLIPS',400,530,'120px Bungee','#ffffff',{borde:16,glow:ROSA,gb:40});
    return;
  }
  cv.width=2560;cv.height=1440;const W=2560,H=1440,hor=960;
  cielo(W,H,hor);sol(1280,hor-40,420);ciudad(W,hor,260);suelo(W,H,hor);
  palmera(80,hor+150,520,1,.9);palmera(300,hor+120,760,1);palmera(2260,hor+120,720,-1);palmera(2490,hor+150,500,-1,.9);
  // oscurecer la franja segura central para la legibilidad
  let gr=g.createLinearGradient(0,508,0,931);
  gr.addColorStop(0,'rgba(10,2,24,0)');gr.addColorStop(.15,'rgba(10,2,24,.55)');gr.addColorStop(.85,'rgba(10,2,24,.55)');gr.addColorStop(1,'rgba(10,2,24,0)');
  g.fillStyle=gr;g.fillRect(507,470,1546,500);
  const X0=507,Y0=508,CX=1280;
  cincoEstrellas(CX,Y0+62,44,110);
  // título con ajuste a la zona segura
  let fs=150;g.font=fs+'px Bungee';let tw=g.measureText('CINCO ESTRELLAS').width;if(tw>1300){fs=Math.floor(fs*1300/tw);tw=1300;}
  texto('CINCO ESTRELLAS',CX,Y0+262,fs+'px Bungee','#ffffff',{borde:18,glow:ROSA,gb:50});
  texto('clips',Math.min(CX+tw/2+150,X0+1546-20),Y0+330,'86px Pacifico',CIAN,{borde:12,glow:CIAN,gb:30,align:'right'});
  texto('LOS MEJORES CLIPS DE GTA 6  ·  PERSECUCIONES  ·  FAILS  ·  LOCURAS',CX,Y0+405,'800 34px Montserrat','#ffe3f1',{borde:8});
  if(window.GUIAS){g.strokeStyle='#0f0';g.lineWidth=3;g.strokeRect(X0,Y0,1546,423);}
};
</script></body></html>
